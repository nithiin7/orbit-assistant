[project]
name = "orbit-api"
version = "0.1.0"
description = "Orbit API: the backend for the Orbit personal assistant."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.22.1,<0.23",
  "alembic>=1.20.1,<2",
  "argon2-cffi>=25.1.0,<26",
  "asyncpg>=0.32.0,<0.33",
  "fastapi>=0.162.0,<0.163",
  "pydantic>=2.14.1,<3",
  "pydantic-settings>=2.16.2,<3",
  "pyjwt[crypto]>=2.15.1,<3",
  "sqlalchemy[asyncio]>=2.1.6,<2.2",
  "uvicorn[standard]>=0.54.0,<0.55",
]

[project.scripts]
orbit-api = "orbit_api.__main__:main"

[dependency-groups]
dev = [
  "httpx2>=2.16.0,<3",
  "pyright==1.1.414",
  "pytest>=9.2.0,<10",
  "ruff==0.17.3",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orbit_api"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "../.."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
  "postgres: needs a PostgreSQL server at ORBIT_TEST_DATABASE_URL (skipped when unset)",
]
xfail_strict = true
filterwarnings = ["error"]

[tool.alembic]
# Used by the `alembic` CLI from apps/api. `orbit_api.db.migrate` builds the same config in code.
script_location = "%(here)s/src/orbit_api/db/migrations"
file_template = "%%(rev)s_%%(slug)s"
