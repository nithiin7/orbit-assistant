packages:
  - apps/*
  - packages/*

# Dependency install scripts are denied unless explicitly allowed (pnpm 11 default).
# unrs-resolver ships prebuilt native bindings as optional dependencies, so its
# postinstall fallback is not needed.
allowBuilds:
  unrs-resolver: false

overrides:
  # GHSA-g3hv-75wg-m249 (globparts DoS) is fixed only in minimatch 11. ESLint, its config-array,
  # and typescript-estree (all lint-only) ask for ^10 but use only `minimatch(path, pattern,
  # { dot: true })` and `new Minimatch(pattern, options).match(path, partial)`, which 11 keeps;
  # `pnpm lint` lints the same files either way.
  "@typescript-eslint/typescript-estree>minimatch": "^11.0.1"
  "@eslint/config-array>minimatch": "^11.0.1"
  "eslint>minimatch": "^11.0.1"

peerDependencyRules:
  allowedVersions:
    # openapi-typescript declares TypeScript 5 but works with 6 (verified by `contracts:check`).
    openapi-typescript>typescript: "6"
